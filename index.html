<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аргус</title>
<style>

:root{
  --bg:#14171d; --bg2:#191d24; --panel:#1e232c; --panel2:#242a35; --line:#2b323e;
  --text:#9aa3b2; --dim:#5b6472; --bright:#cdd3dd;
  --acc:#38bdf8; --ok:#3aa981; --warn:#d97706; --bad:#c04b3f; --ghost:#8d76b8;
  --mono:'Consolas','JetBrains Mono','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2c333e;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:var(--bg)}

.btn{background:#20262f;border:1px solid var(--line);color:var(--text);padding:5px 11px;cursor:pointer;font-size:12px;border-radius:2px}
.btn:hover:not(:disabled){border-color:var(--acc);color:var(--bright)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{border-color:#2c5d7a;color:#bfe6fa}
.btn.danger{border-color:#6e3630;color:#e0a29a}
.btn.small{padding:2px 8px;font-size:11px}

/* ---------- Верхняя панель ---------- */
#topbar{height:46px;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
.logo{color:var(--bright);font-weight:600;font-size:13px;letter-spacing:.4px;white-space:nowrap}
.logo span{color:var(--dim);font-weight:400}
.stat{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
.stat b{color:var(--text);font-weight:400}
.stat.warn b{color:var(--warn)}
.stat.bad b{color:var(--bad);animation:pulse 1.1s infinite}
#endShift{display:none;margin-left:auto}
#endShift.on{display:inline-block;animation:pulse 1.6s infinite;border-color:var(--warn);color:#f0c58d}
.iconbtn{background:none;border:1px solid var(--line);color:var(--dim);cursor:pointer;padding:4px 8px;border-radius:2px}
.iconbtn:hover{color:var(--bright);border-color:var(--acc)}

/* ---------- Каркас ---------- */
#main{display:grid;grid-template-columns:190px 1fr;height:calc(100vh - 46px)}
#sidebar{background:var(--bg2);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--text);padding:7px 9px;cursor:pointer;font-size:12px;border-radius:2px}
.nav:hover:not(:disabled){background:var(--panel)}
.nav.active{background:var(--panel2);border-color:var(--line);color:var(--bright)}
.nav:disabled{opacity:.3;cursor:default}
.nav .dot{width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:auto;display:none}
.nav .dot.on{display:block}
.side-note{margin-top:auto;font-size:10px;color:var(--dim);font-family:var(--mono);padding:6px;line-height:1.6}

#workcol{display:flex;flex-direction:column;min-width:0}
body.dopen #workcol{padding-bottom:244px}
#tabbar{display:flex;gap:2px;background:var(--bg2);border-bottom:1px solid var(--line);padding:6px 8px 0;overflow-x:auto;min-height:36px}
.tab{display:flex;gap:7px;align-items:center;background:var(--panel);border:1px solid var(--line);border-bottom:none;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--dim);border-radius:3px 3px 0 0;white-space:nowrap}
.tab.active{background:var(--panel2);color:var(--bright)}
.tab .x{color:var(--dim);font-size:11px}
.tab .x:hover{color:var(--bad)}
#workspace{flex:1;overflow:auto;padding:14px 16px;background:var(--bg)}

/* ---------- Панели ---------- */
.panel{background:var(--panel);border:1px solid var(--line);padding:12px 14px;margin-bottom:12px;border-radius:2px}
h2.sec{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin-bottom:10px;font-weight:600}
.tbody{white-space:pre-wrap;background:#171b22;border:1px solid var(--line);padding:12px;font-size:13px;color:#b6bfcc}
.muted{color:var(--dim)}
.hline{border:none;border-top:1px dashed var(--line);margin:10px 0}
.meta{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-family:var(--mono);font-size:12px;margin-bottom:10px}
.meta .k{color:var(--dim)}
.hist{font-size:12.5px;margin-bottom:6px;padding:7px 10px;border-left:2px solid var(--line);background:#1a1f28;white-space:pre-wrap}
.hist.sys{border-left-color:#3b4a5c}
.hist.op{border-left-color:var(--acc)}
.hist.k{border-left-color:var(--ghost);color:#c6b4dd;font-style:italic}

/* ---------- Тикеты ---------- */
.trow{display:grid;grid-template-columns:64px 120px 1fr 90px 100px;gap:8px;padding:8px 10px;border:1px solid var(--line);border-top:none;background:var(--panel);cursor:pointer;font-size:12px;align-items:center}
.trow.head{cursor:default;background:var(--bg2);color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em;border-top:1px solid var(--line)}
.trow:not(.head):hover{background:var(--panel2)}
.tid{font-family:var(--mono);color:var(--acc)}
.st{font-family:var(--mono);font-size:10px;padding:2px 6px;border:1px solid var(--line);text-align:center}
.st.open{color:var(--acc)}
.st.closed{color:var(--dim)}
.st.unresolved{color:#e08a80;border-color:var(--bad)}
.prio-low{color:var(--dim)} .prio-mid{color:var(--warn)} .prio-high{color:#e08a80}

/* ---------- Логи ---------- */
.logt{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
.logt td{border:1px solid var(--line);padding:4px 7px;color:var(--text)}
.logt tr{cursor:pointer}
.logt tr:hover td{background:var(--panel2)}
.logt tr.sel td{background:#24303d}
.logt tr.bad td{color:#d98a80}
.logt tr.phantom td{color:var(--ghost);font-style:italic}
input.search,select.search{background:#12151a;border:1px solid var(--line);color:var(--bright);font-family:var(--mono);padding:6px 9px;outline:none;font-size:12px}
input.search:focus{border-color:var(--acc)}

/* ---------- Карта ---------- */
.nmap{background:#11141a;border:1px solid var(--line);display:block;width:100%}
.nlabel{font-family:var(--mono);font-size:10px;fill:var(--dim)}

/* ---------- Архив ---------- */
.crumb{font-family:var(--mono);font-size:12px;color:var(--dim);margin-bottom:10px}
.crumb b{color:var(--acc);cursor:pointer;font-weight:400}
.frow{display:flex;gap:10px;align-items:center;padding:7px 11px;border:1px solid var(--line);border-top:none;cursor:pointer;background:var(--panel);font-family:var(--mono);font-size:12px}
.frow:first-of-type{border-top:1px solid var(--line)}
.frow:hover{background:var(--panel2)}
.frow .ic{width:16px;text-align:center}
.frow .lock{color:var(--warn);margin-left:auto;font-size:11px}
.filebox{white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:#11141a;border:1px solid var(--line);padding:14px;color:#b9c2cf}

/* ---------- Чат ---------- */
.msg{max-width:78%;padding:8px 12px;border:1px solid var(--line);margin-bottom:9px;font-size:12.5px;white-space:pre-wrap;background:var(--panel)}
.msg.d{background:#22222e;border-color:#34354a}
.msg.s{background:#1c2733;border-color:#2b4257;font-family:var(--mono);font-size:11.5px}
.msg.k{background:#292131;border-color:#463856;color:#cdbbe2;font-style:italic}
.msg.op{background:#1d2731;border-color:#2e4a5c;margin-left:auto}
.msglabel{font-size:10px;color:var(--dim);margin-bottom:2px;font-family:var(--mono)}

/* ---------- Терминал ---------- */
#drawer{position:fixed;left:190px;right:0;bottom:0;height:240px;background:#0c0e12;border-top:1px solid var(--line);transform:translateY(105%);transition:transform .25s;z-index:40;display:flex;flex-direction:column}
#drawer.open{transform:none}
#termhead{display:flex;justify-content:space-between;padding:5px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--dim)}
#termout{flex:1;overflow:auto;padding:10px 12px;font-family:var(--mono);font-size:12px;color:#7fbf8f;white-space:pre-wrap}
#termout .err{color:#d98a80}
#termout .cmd{color:#cdd3dd}
#termlin{display:flex;border-top:1px solid var(--line)}
#termlin span{padding:8px 4px 8px 12px;color:#7fbf8f;font-family:var(--mono)}
#terminput{flex:1;background:none;border:none;outline:none;color:#cfe6d4;font-family:var(--mono);font-size:12px;padding:8px 12px 8px 6px}

/* ---------- Уведомления ---------- */
#toasts{position:fixed;right:14px;top:56px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:#1c222c;border:1px solid var(--line);border-left:3px solid var(--acc);padding:9px 13px;font-size:12px;opacity:0;transform:translateX(14px);transition:.3s;max-width:330px}
.toast.show{opacity:1;transform:none}
.toast.bad{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}

/* ---------- Оверлей ---------- */
#overlay{position:fixed;inset:0;background:rgba(7,9,13,.86);z-index:100;display:none;align-items:center;justify-content:center}
#overlay.on{display:flex}
.modal{width:min(660px,92vw);max-height:86vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);padding:26px 30px}
.ov-title{font-family:var(--mono);color:var(--bright);font-size:15px;margin-bottom:16px;letter-spacing:.06em}
.ov-line{font-family:var(--mono);font-size:12.5px;color:var(--text);margin-bottom:7px;white-space:pre-wrap}
.ov-line.dim{color:var(--dim)}
.ov-line.bad{color:#d98a80}
.ov-line.acc{color:var(--acc)}
.ov-btns{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.ov-input{width:100%;background:#12151a;border:1px solid var(--line);color:var(--bright);font-family:var(--mono);padding:8px 10px;margin-top:10px;outline:none}
.ov-input:focus{border-color:var(--acc)}
.ov-hint{font-size:11px;color:var(--dim);margin-top:8px}

/* ---------- CRT / глюки ---------- */
#scan{position:fixed;inset:0;pointer-events:none;z-index:200;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);opacity:.26}
#vig{position:fixed;inset:0;pointer-events:none;z-index:199;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.5))}
body.g3 #scan{opacity:.5}
body.inv{filter:invert(1)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes jit{0%,93%{transform:none}94%{transform:translateX(2px)}95%{transform:translateX(-2px)}96%{transform:translateX(1px)}97%,100%{transform:none}}
body.g2 .panel{animation:jit 12s infinite}
@keyframes ab{0%,89%,100%{text-shadow:none}91%{text-shadow:-2px 0 rgba(255,0,70,.45),2px 0 rgba(0,180,255,.45)}94%{text-shadow:2px 0 rgba(255,0,70,.45),-2px 0 rgba(0,180,255,.45)}}
body.g2 .logo,body.g2 h2.sec{animation:ab 8s infinite}
.evidence-row{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:12px;padding:6px 10px;border:1px solid var(--line);border-top:none;background:var(--panel)}
.evidence-row:first-of-type{border-top:1px solid var(--line)}
.fact{padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.fact:last-child{border-bottom:none}
.finalbtn{display:block;width:100%;text-align:left;margin-bottom:8px;padding:10px 12px}
.finalbtn small{display:block;color:var(--dim);margin-top:3px;font-size:11px}
</style>
</head>
<body>

<!-- ВЕРХНЯЯ ПАНЕЛЬ -->
<header id="topbar">
  <div class="logo">СЕВЕРНЫЙ КАНАЛ <span>| АРГУС v4.1.2</span></div>
  <div class="stat">СМЕНА <b id="shiftN">0</b></div>
  <div class="stat">ВРЕМЯ <b id="clock">00:00</b></div>
  <div class="stat" id="stStab" title="Стабильность сети">UPTIME <b id="uptime">100%</b></div>
  <div class="stat" id="stAudit" title="Security Audit Sync — фоновая проверка безопасности">AUDIT SYNC <b id="audit">0%</b></div>
  <button class="btn" id="endShift" onclick="endShiftNow()">Завершить смену</button>
  <button class="iconbtn" id="muteBtn" onclick="toggleMute()" title="Звук">🔊</button>
  <div class="stat">OP-884 | NIGHT</div>
</header>

<div id="main">
  <!-- ЛЕВАЯ ПАНЕЛЬ -->
  <nav id="sidebar">
    <button class="nav" id="nav-tickets" onclick="openTabTo('tickets')">📨 Входящие <span class="dot" id="tickDot"></span></button>
    <button class="nav" id="nav-logs"     onclick="openTabTo('logs')">📄 Журнал</button>
    <button class="nav" id="nav-map"      onclick="openTabTo('map')">🗺 Карта сети</button>
    <button class="nav" id="nav-archive"  onclick="openTabTo('archive')">🗄 Архив</button>
    <button class="nav" id="nav-terminal" onclick="toggleDrawer()">⌨ Терминал</button>
    <button class="nav" id="nav-chat"     onclick="openTabTo('chat')">💬 Диспетчер <span class="dot" id="chatDot"></span></button>
    <button class="nav" id="nav-case"     onclick="openTabTo('case')" style="display:none">📌 Дело</button>
    <button class="nav" id="nav-notes"    onclick="openTabTo('notes')">📝 Заметки</button>
    <button class="nav" id="nav-quiet"    onclick="openTabTo('quiet')" style="display:none">▓ Тихий канал</button>
    <div class="side-note">Терминал: клавиша ~<br>Не закрывайте тикеты<br>UNRESOLVED без проверки.</div>
  </nav>

  <!-- РАБОЧАЯ ОБЛАСТЬ -->
  <div id="workcol">
    <div id="tabbar"></div>
    <div id="workspace"></div>
  </div>
</div>

<!-- ТЕРМИНАЛ -->
<div id="drawer">
  <div id="termhead"><span>АРГУС // служебный терминал</span><span onclick="toggleDrawer()" style="cursor:pointer">[ свернуть ]</span></div>
  <div id="termout"></div>
  <div id="termlin"><span>OP-884@argus:~$</span><input id="terminput" autocomplete="off" spellcheck="false"
      onkeydown="termKey(event)" placeholder="help — список команд"></div>
</div>

<div id="toasts"></div>
<div id="overlay"></div>
<div id="vig"></div>
<div id="scan"></div>

<script>
'use strict';
/* =====================================================================
   1. УТИЛИТЫ
===================================================================== */
const $ = s => document.querySelector(s);
function el(tag, cls){ const d=document.createElement(tag); if(cls) d.className=cls; return d; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escbr(s){ return esc(s).replace(/\n/g,'<br>'); }
function fmt(min){ const h=Math.floor(min/60)%24, m=min%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function nowT(){ return fmt(state.minutes)+':'+String(Math.floor(Math.random()*60)).padStart(2,'0'); }
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }

/* ---------- звук (WebAudio, без файлов) ---------- */
let AC=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(f=880,d=.06,type='square',g=.03){
  if(state.muted) return;
  try{ const a=audio(); if(!a) return;
    const o=a.createOscillator(), gn=a.createGain();
    o.type=type; o.frequency.value=f; gn.gain.value=g;
    o.connect(gn); gn.connect(a.destination); o.start();
    gn.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d); o.stop(a.currentTime+d);
  }catch(e){}
}
const sNotify=()=>{beep(740,.05);setTimeout(()=>beep(980,.06),70);};
const sClick =()=>beep(1300,.02,'square',.012);
const sError =()=>beep(170,.16,'sawtooth',.04);
function toggleMute(){ state.muted=!state.muted; $('#muteBtn').textContent=state.muted?'🔇':'🔊'; }

/* =====================================================================
   2. СОСТОЯНИЕ ИГРЫ
===================================================================== */
const state = {
  shift:0, minutes:0, attention:0, stability:100,
  tickets:{}, ticketOrder:[], logs:[], chat:[], notes:[], facts:[], evidence:[],
  flags:{}, tabs:[], active:null,
  kiraUnlocked:false, lostUnlocked:false,
  node17Visible:false, node17Connected:false,
  selNode:null, selLog:null, logQ:'',
  archivePath:['archive'], archiveFile:null,
  endOffered:false, over:false, muted:false, unreadChat:false
};
let logId=0;
function lg(t,node,user,event,details,cls){ return {id:++logId,t,node,user,event,details,cls:cls||''}; }
function addLog(l){ state.logs.push(l); }

/* ---------- улики ---------- */
const EV = {
  ev_time_sync:{file:'time_sync_error.log'},
  ev_kira_login:{file:'kira_login.log'},
  ev_draft:{file:'last_message_draft.txt'},
  ev_index:{file:'lost_sessions_index.log'},
  ev_dump:{file:'node17_session_dump.bin'},
  ev_directive:{file:'quiet_channel_directive.log'},
};
function hasEv(id){ return state.evidence.some(e=>e.id===id); }
function addEvidence(id){
  if(!EV[id]) return;
  if(hasEv(id)){ toast('Улика уже собрана: '+EV[id].file); return; }
  state.evidence.push({id,file:EV[id].file});
  toast('Улика сохранена: '+EV[id].file);
  sNotify();
}
function evPartial(){ return state.evidence.length>=2; }
function evComplete(){ return ['ev_kira_login','ev_draft','ev_index','ev_dump','ev_directive'].every(hasEv); }

function fact(f){ if(!state.facts.includes(f)){ state.facts.push(f); } }

/* ---------- внимание системы ---------- */
function attn(n){
  state.attention=Math.max(0,Math.min(100,state.attention+n));
  if(state.attention>=100 && !state.over) ending('END_OBSERVER');
}

/* =====================================================================
   3. UI: ТОСТЫ, МОДАЛИ, ВКЛАДКИ
===================================================================== */
function toast(text,cls){
  const d=el('div','toast '+(cls||'')); d.textContent=text;
  $('#toasts').appendChild(d); sNotify();
  requestAnimationFrame(()=>d.classList.add('show'));
  setTimeout(()=>{ d.classList.remove('show'); setTimeout(()=>d.remove(),400); },4200);
}

function hideOverlay(){ const o=$('#overlay'); o.classList.remove('on'); o.innerHTML=''; }
function typeText(elm,text,done){
  if(!text){ done&&done(); return; }
  let i=0; const step=text.length>60?3:1;
  (function st(){ i+=step; elm.textContent=text.slice(0,i);
    if(i<text.length) setTimeout(st,16); else done&&done(); })();
}
/* Оверлей с печатающимися строками. lines: [{text,cls,pause}] */
function overlay(title,lines,buttons){
  const o=$('#overlay'); o.innerHTML=''; o.classList.add('on');
  const m=el('div','modal');
  if(title){ const h=el('div','ov-title'); h.textContent=title; m.appendChild(h); }
  const body=el('div'); m.appendChild(body);
  const btns=el('div','ov-btns'); m.appendChild(btns);
  o.appendChild(m);
  let i=0;
  (function next(){
    if(i>=lines.length){
      (buttons||[]).forEach(b=>{
        const bt=el('button','btn '+(b.cls||'primary')); bt.textContent=b.label;
        bt.onclick=()=>{ sClick(); b.cb&&b.cb(); }; btns.appendChild(bt);
      });
      return;
    }
    const L=lines[i++]; const d=el('div','ov-line '+(L.cls||'')); body.appendChild(d);
    typeText(d,L.text,()=>setTimeout(next, L.pause===undefined?170:L.pause));
  })();
}
/* Статичная модалка (без печати) */
function modalStatic(title,text,buttons){
  overlay(title,(text||'').split('\n').map(t=>({text:t})),buttons);
}
function modalAsk(title,hint,placeholder,onSubmit){
  const o=$('#overlay'); o.innerHTML=''; o.classList.add('on');
  const m=el('div','modal');
  m.innerHTML='<div class="ov-title"></div><div class="ov-hint"></div>';
  m.querySelector('.ov-title').textContent=title;
  m.querySelector('.ov-hint').textContent=hint||'';
  const inp=el('input','ov-input'); inp.placeholder=placeholder||''; m.appendChild(inp);
  const row=el('div','ov-btns');
  const ok=el('button','btn primary'); ok.textContent='Ввести';
  const cancel=el('button','btn'); cancel.textContent='Отмена';
  ok.onclick=()=>{ if(onSubmit(inp.value.trim())!==false){ /* закрыл сам обработчик */ } };
  cancel.onclick=hideOverlay;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') ok.onclick(); });
  row.appendChild(ok); row.appendChild(cancel); m.appendChild(row); o.appendChild(m);
  setTimeout(()=>inp.focus(),50);
}
function modalConfirm(title,text,onYes){
  modalStatic(title,text,[
    {label:'Подтвердить',cls:'danger',cb:()=>{hideOverlay();onYes();}},
    {label:'Отмена',cls:'',cb:hideOverlay}
  ]);
}

/* ---------- вкладки ---------- */
function tabTitle(t){
  switch(t.type){
    case 'tickets': return 'Очередь';
    case 'ticket':  return 'Тикет #'+t.id;
    case 'logs':    return 'Журнал';
    case 'map':     return 'Карта сети';
    case 'archive': return 'Архив';
    case 'chat':    return 'Диспетчер';
    case 'case':    return 'Дело';
    case 'notes':   return 'Заметки';
    case 'quiet':   return 'Тихий канал';
    case 'final':   return 'Тикет #9999';
  }
  return '?';
}
function openTab(type,id){
  const key=type+':'+(id||'');
  let t=state.tabs.find(x=>x.key===key);
  if(!t){ t={key,type,id}; state.tabs.push(t); }
  state.active=key;
  if(type==='chat'){ state.unreadChat=false; }
  renderAll();
}
function openTabTo(type,id){ sClick(); openTab(type,id); }
function closeTabUI(key){
  sClick();
  state.tabs=state.tabs.filter(t=>t.key!==key);
  if(state.active===key){ const last=state.tabs[state.tabs.length-1]; state.active=last?last.key:null; }
  renderAll();
}

/* =====================================================================
   4. РЕНДЕР
===================================================================== */
function renderAll(){
  /* верхняя панель */
  $('#clock').textContent=fmt(state.minutes);
  $('#shiftN').textContent=state.shift;
  $('#uptime').textContent=state.stability+'%';
  $('#audit').textContent=state.attention+'%';
  $('#stAudit').className='stat '+(state.attention>=75?'bad':state.attention>=40?'warn':'');
  $('#stStab').className='stat '+(state.stability<50?'bad':state.stability<80?'warn':'');
  /* глитч-уровни */
  document.body.classList.toggle('g1',state.attention>=25);
  document.body.classList.toggle('g2',state.attention>=50);
  document.body.classList.toggle('g3',state.attention>=75);
  /* сайдбар */
  $('#nav-map').disabled     = state.shift<1;
  $('#nav-terminal').disabled= state.shift<1;
  $('#nav-archive').disabled = state.shift<2;
  $('#nav-case').style.display = (state.flags.anomaly_seen||state.flags.ticket_4471_saved)?'flex':'none';
  $('#nav-quiet').style.display= state.shift>=5?'flex':'none';
  $('#chatDot').classList.toggle('on',state.unreadChat);
  $('#tickDot').classList.toggle('on',state.ticketOrder.some(id=>state.tickets[id].status==='open'&&!state.tickets[id].seen));
  state.tabs.forEach(t=>{ const nav=$('#nav-'+(t.type==='ticket'?'tickets':t.type)); });
  document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
  const at=state.tabs.find(t=>t.key===state.active);
  if(at){ const nav=$('#nav-'+(at.type==='ticket'?'tickets':at.type)); if(nav) nav.classList.add('active'); }
  /* вкладки */
  const tb=$('#tabbar'); tb.innerHTML='';
  state.tabs.forEach(t=>{
    const d=el('div','tab'+(t.key===state.active?' active':''));
    d.innerHTML='<span>'+esc(tabTitle(t))+'</span><span class="x">✕</span>';
    d.querySelector('span:first-child').onclick=()=>openTab(t.type,t.id);
    d.querySelector('.x').onclick=(e)=>{e.stopPropagation();closeTabUI(t.key);};
    tb.appendChild(d);
  });
  /* содержимое */
  const ws=$('#workspace'); ws.innerHTML='';
  if(!at){ ws.innerHTML='<div class="panel muted">Выберите раздел в меню слева.</div>'; return; }
  switch(at.type){
    case 'tickets': ws.appendChild(viewTickets()); break;
    case 'ticket':  ws.appendChild(viewTicket(at.id)); break;
    case 'logs':    ws.appendChild(viewLogs()); break;
    case 'map':     ws.appendChild(viewMap()); break;
    case 'archive': ws.appendChild(viewArchive()); break;
    case 'chat':    ws.appendChild(viewChat()); break;
    case 'case':    ws.appendChild(viewCase()); break;
    case 'notes':   ws.appendChild(viewNotes()); break;
    case 'quiet':   ws.appendChild(viewQuiet()); break;
    case 'final':   ws.appendChild(viewFinal()); break;
  }
}

/* ---------- очередь тикетов ---------- */
function viewTickets(){
  const w=el('div');
  w.innerHTML='<div class="panel"><h2 sec></h2></div>';
  const p=w.firstChild; p.querySelector('h2').textContent='Входящие обращения — ночная смена';
  const head=el('div','trow head');
  head.innerHTML='<span>ID</span><span>Пользователь</span><span>Тема</span><span>Приоритет</span><span>Статус</span>';
  p.appendChild(head);
  if(!state.ticketOrder.length) p.appendChild(el('div','muted')).textContent='Очередь пуста.';
  state.ticketOrder.forEach(id=>{
    const t=state.tickets[id];
    const r=el('div','trow');
    r.innerHTML='<span class="tid">#'+t.id+'</span><span>'+esc(t.user)+'</span><span>'+esc(t.subject)+
      '</span><span class="prio-'+t.prio+'">'+({low:'низкий',mid:'средний',high:'высокий'}[t.prio])+
      '</span><span class="st '+t.status+'">'+t.status.toUpperCase()+'</span>';
    r.onclick=()=>{ t.seen=true; openTab('ticket',id); };
    p.appendChild(r);
  });
  return w;
}

/* ---------- тикет ---------- */
function viewTicket(id){
  const t=state.tickets[id]; const w=el('div');
  if(!t){ w.innerHTML='<div class="panel">Тикет не найден.</div>'; return w; }
  const p=el('div','panel');
  p.innerHTML='<h2 class="sec">Тикет #'+t.id+'</h2>'+
    '<div class="meta">'+
    '<span class="k">Пользователь</span><span>'+esc(t.user)+'</span>'+
    '<span class="k">Тема</span><span>'+esc(t.subject)+'</span>'+
    '<span class="k">Приоритет</span><span>'+({low:'низкий',mid:'средний',high:'высокий'}[t.prio])+'</span>'+
    '<span class="k">Статус</span><span class="st '+t.status+'">'+t.status.toUpperCase()+'</span>'+
    '</div><div class="tbody">'+escbr(t.body)+'</div>';
  w.appendChild(p);
  /* история действий */
  if(t.history.length){
    const h=el('div','panel'); h.innerHTML='<h2 class="sec">Ход обработки</h2>';
    t.history.forEach(x=>{ const d=el('div','hist '+x.who); d.innerHTML=escbr(x.text); h.appendChild(d); });
    w.appendChild(h);
  }
  /* связанные логи */
  const rel=state.logs.filter(l=>l.user===t.user).slice(-10);
  if(rel.length){
    const lp=el('div','panel'); lp.innerHTML='<h2 class="sec">Связанные записи журнала</h2>';
    lp.appendChild(logTable(rel));
    w.appendChild(lp);
  }
  /* действия */
  const ap=el('div','panel'); ap.innerHTML='<h2 class="sec">Действия</h2>';
  const row=el('div'); row.style.display='flex'; row.style.gap='8px'; row.style.flexWrap='wrap';
  t.doneActs=t.doneActs||{};
  (t.actions||[]).forEach(a=>{
    const b=el('button','btn'); b.textContent=a.label;
    b.disabled=!!t.doneActs[a.label];
    b.onclick=()=>{ t.doneActs[a.label]=true; sClick(); ACT[a.act]&&ACT[a.act](t); afterAct(); };
    row.appendChild(b);
  });
  const cb=el('button','btn primary'); cb.textContent='Закрыть тикет';
  cb.disabled=!(t.closeable&&t.status==='open');
  cb.onclick=()=>closeTicketUI(id);
  row.appendChild(cb);
  ap.appendChild(row);
  if(!t.closeable) ap.appendChild(el('div','muted')).textContent='Система не рекомендует закрывать этот тикет.';
  w.appendChild(ap);
  return w;
}
function hist(t,who,text){ t.history.push({who,text}); }
function closeTicketUI(id){
  const t=state.tickets[id]; if(!t) return;
  if(!t.closeable){ toast('Невозможно закрыть тикет #'+id+'. Проверьте архив.','warn'); sError(); return; }
  t.status='closed'; hist(t,'sys','Тикет закрыт оператором OP-884.');
  toast('Тикет #'+id+' закрыт.'); sClick();
  afterAct();
}

/* ---------- таблица логов ---------- */
function logTable(rows,selFn){
  const tb=el('table','logt');
  rows.forEach(l=>{
    const tr=el('tr',(l.cls||'')+(state.selLog===l.id?' sel':''));
    tr.dataset.txt=(l.t+' '+l.node+' '+l.user+' '+l.event+' '+l.details).toLowerCase();
    tr.innerHTML='<td>'+l.t+'</td><td>'+esc(l.node)+'</td><td>'+esc(l.user)+'</td><td>'+esc(l.event)+'</td><td>'+esc(l.details)+'</td>';
    tr.onclick=()=>selFn?selFn(l):selectLog(l.id);
    tb.appendChild(tr);
  });
  return tb;
}
function viewLogs(){
  const w=el('div');
  const p=el('div','panel');
  p.innerHTML='<h2 class="sec">Журнал сети</h2>'+
    '<div style="margin-bottom:10px;display:flex;gap:8px">'+
    '<input class="search" id="logSearch" style="width:320px" placeholder="поиск по журналу..." oninput="logSearch(this.value)">'+
    '</div>';

function logSearch(v){ state.logQ=v.toLowerCase(); logFilterRows(); }
function logFilterRows(){
  document.querySelectorAll('#logrows tr').forEach(tr=>{
    tr.style.display=tr.dataset.txt.includes(state.logQ)?'':'none';
  });
}
function selectLog(id){
  state.selLog=id;
  document.querySelectorAll('#logrows tr').forEach(tr=>tr.classList.toggle('sel',tr.dataset.txt&&false));
  const l=state.logs.find(x=>x.id===id); if(!l) return;
  const sp=$('#logsel'); if(!sp) return;

    const b=el('button','btn primary'); b.textContent='Сохранить фрагмент как улику'; b.style.marginTop='8px';

  }
  sClick();
}

function selectNode(id){ state.selNode=id; sClick(); renderAll(); }
function nodeAct(a){
  const id=state.selNode;
  if(a==='ping'){
    if(id==='NODE-17'){
      toast('PING NODE-17: Request timeout.');
      addLog(lg(nowT(),'NODE-17','','PING','request timeout'));
      setTimeout(()=>{ toast('Unexpected reply from NODE-17.','bad'); addLog(lg(nowT(),'NODE-17','','PING_REPLY','response_without_source','bad')); attn(3); renderAll(); },2600);
    } else toast('PING '+id+': alive, 12 ms.');
    return;
  }
  if(id!=='NODE-17') return;
  if(a==='open'){
    modalConfirm('Открыть сессию','Подключение к неучтённому узлу.\nДействие будет зафиксировано.\nПродолжить?',connectNode17);
  }
  if(a==='dump'){
    addEvidence('ev_dump'); attn(15);
    hist0('Дамп сессии NODE-17 сохраняется... Источник пакетов аномален.');
    afterAct();
  }
  if(a==='block'){
    state.stability=Math.max(0,state.stability-5);
    toast('Узел 17 изолирован.'); addLog(lg(nowT(),'NODE-17','','ISOLATE','by operator'));
    setTimeout(()=>{ toast('Узел 17 снова отвечает. Источник: внутренний терминал.','bad');
      addLog(lg(nowT(),'NODE-17','','RESPONSE','source=internal_terminal','bad')); attn(5); renderAll(); },4200);
    afterAct();
  }
}
function hist0(text){ const t=state.tickets['4717']||state.tickets['4471']; if(t) hist(t,'sys',text); }
function connectNode17(){
  state.node17Connected=true; attn(10);
  addLog(lg(nowT(),'NODE-17','','CONNECT','operator auth accepted','bad'));
  addLog(lg(nowT(),'NODE-17','OP-884','SESSION_LINK','target=OP-884 state=observation','bad'));
  addLog(lg(nowT(),'NODE-17','','RESPONSE_SOURCE','source=OPERATOR_TERMINAL_02','bad'));
  state.flags.terminal02_seen=true;
  fact('Узел 17 отвечает через OPERATOR_TERMINAL_02.');
  fact('SESSION_LINK: узел 17 связан с сессией оператора.');
  toast('NODE-17 connected.','bad'); sError();
  setTimeout(()=>dispMsg('Я вижу твой запрос к Узлу 17.\nОстановись.\nТы не понимаешь, что открываешь.\nНе отвечай ему. Он использует старые сессии.'),1500);
  setTimeout(()=>{

      [{label:'Закрыть',cb:()=>{hideOverlay();afterAct();}}]);
  },900);
}

function archNode(path){
  let n=ARCHIVE;
  for(let i=1;i<path.length;i++){
    const next=(n.children||[]).find(c=>c.name===path[i]);
    if(!next) return null; n=next;
  }
  return n;
}

function pushChat(who,text){

function topicAsk(id){
  const tp=TOPICS.find(t=>t.id===id); if(!tp) return;
  state.flags['topic_'+id]=true;
  pushChat('op',tp.label+'?');
  toast('Диспетчер печатает…');
  const ans=typeof tp.ans==='function'?tp.ans():tp.ans;
  setTimeout(()=>{ dispMsg(ans); afterAct(); },1400);

function sendChat(text){
  pushChat('op',text); sClick();
  const low=text.toLowerCase();
  let reply;
  if(low.includes('17')) reply='Не трогай старые узлы.';
  else if(low.includes('кир')||low.includes('lansk')) reply=state.shift>=2?'Если пользователь не выходит на связь — закрывай по регламенту.':'Нет такого пользователя в активной базе.';
  else reply=rnd(GENERIC_DISP);
  toast('Диспетчер печатает…');
  setTimeout(()=>{ dispMsg(reply); renderAll(); },1300);
  renderAll();
}

function loadShift(n){
  state.shift=n; state.minutes=START[n]||0; state.endOffered=false;
  $('#endShift').classList.remove('on');
  buildShift(n).forEach(spawnTicket);
  (SHIFT_SYS[n]||[]).forEach((m,i)=>setTimeout(()=>{ pushChat('s',m); toast(m,'warn'); },500+i*1100));
  (SHIFT_DISP[n]||[]).forEach((m,i)=>setTimeout(()=>dispMsg('Савельев:\n'+m.replace(/^Савельев:\n?/,'')),1200+i*1600));
  if(n===0){
    state.notes=[{id:'n1',undecided:true,
      text:'Если появится тикет с флагом UNRESOLVED,\nне закрывай его без проверки архива.\n— Е.М.'}];
  }
  if(n===1){ addLog(lg('00:00:02','ARGUS','','SHIFT','shift=1 started')); }
  if(n===2){ fact('Подсказка к коду архива — в старых тикетах: /archive/old_tickets/.'); }
  if(n===6){ openTab('final'); }
  else openTab('tickets');
  renderAll();
}

const termHist=[]; let termIdx=-1;
function toggleDrawer(){ $('#drawer').classList.toggle('open'); document.body.classList.toggle('dopen'); if($('#drawer').classList.contains('open')) setTimeout(()=>$('#terminput').focus(),250); }
function tprint(text,cls){
  const out=$('#termout');
  const d=document.createElement('div'); if(cls) d.className=cls; d.textContent=text;
  out.appendChild(d); out.scrollTop=out.scrollHeight;
}
function termKey(e){
  if(e.key==='Enter'){
    const inp=$('#terminput'); const raw=inp.value; inp.value='';
    if(raw.trim()){ termHist.push(raw); termIdx=termHist.length; }
    tprint('OP-884@argus:~$ '+raw,'cmd');
    termExec(raw);
  }
  if(e.key==='ArrowUp'){ if(termIdx>0){termIdx--;$('#terminput').value=termHist[termIdx]||'';} e.preventDefault(); }
  if(e.key==='ArrowDown'){ if(termIdx<termHist.length){termIdx++;$('#terminput').value=termHist[termIdx]||'';} e.preventDefault(); }
}
function logLine(l){ return l.t+' '+l.node+' '+l.user+' '+l.event+' '+l.details; }
function termExec(raw){
  const a=raw.trim().split(/\s+/).filter(Boolean); if(!a.length) return;
  const c=a[0].toLowerCase();
  const HELP='Доступные команды:\n  help, clear, status, whoami, time\n  tickets | ticket show <id>\n  logs | logs grep <текст> | logs filter user=<x> | logs filter node=<x>\n  nodes list | node info <NODE-XX> | ping <NODE-XX>\n  trace hidden_route [--force]\n  ls | cat <путь> | unlock archive <код> | unlock lost_sessions <код>\n  cp <путь>  (копировать улику)\n  sec status | contact k.lanskaya\n  Финал: isolate NODE-17 | upload evidence --external |\n           rescue session 7741-KL | replace session OP-884 | delete all';
  switch(c){
  case 'help': tprint(HELP); break;
  case 'clear': $('#termout').innerHTML=''; break;
  case 'status': tprint('Смена: '+state.shift+'. Аудит: '+state.attention+'%. Аптайм: '+state.stability+'%.'); break;
  case 'whoami': tprint('OP-884'); break;
  case 'time': tprint(fmt(state.minutes)); break;
  case 'tickets':
    tprint(Object.values(state.tickets).map(t=>'#'+t.id+' ['+t.status.toUpperCase()+'] '+t.user+': '+t.subject).join('\n')||'Очередь пуста.'); break;
  case 'ticket':
    if(a[1]==='show'&&state.tickets[a[2]]){ openTab('ticket',a[2]); tprint('Открываю тикет #'+a[2]); }
    else tprint('Использование: ticket show <id>','err'); break;
  case 'logs': {
    let rows=state.logs.slice();
    if(a[1]==='grep'&&a[2]){ const q=a.slice(2).join(' ').toLowerCase(); rows=rows.filter(l=>logLine(l).toLowerCase().includes(q)); }
    else if(a[1]==='filter'&&a[2]){ const [k,v]=a[2].split('='); rows=rows.filter(l=>(k==='user'?l.user:l.node)===v); }
    else rows=rows.slice(-12);
    tprint(rows.map(logLine).join('\n')||'Ничего не найдено.');
    if(a[1]==='grep'&&a[2]) attn(3);
    break; }
  case 'nodes': tprint(NODES.map(nodeStateLine).join('\n')); break;
  case 'node':
    if(a[1]==='info'){ const n=NODES.find(x=>x.id===(a[2]||'').toUpperCase()); tprint(n?nodeStateLine(n):'Узел не найден.',n?'':'err'); if(n&&n.id==='NODE-17'&&state.node17Visible) attn(2); }
    else tprint('Использование: node info <NODE-XX>','err'); break;
  case 'ping': {
    const id=(a[1]||'').toUpperCase();
    if(id==='NODE-17'){
      if(!state.node17Visible){ tprint('Узел не найден в активной таблице.','err'); break; }
      tprint('PING NODE-17: Request timeout...');
      setTimeout(()=>{ tprint('Unexpected reply from NODE-17.','err'); attn(3); },2400);
    } else if(NODES.find(n=>n.id===id)) tprint(id+': alive, 12 ms');
    else tprint('Неизвестный узел.','err');
    break; }
  case 'trace': {
    if(a[1]!=='hidden_route'){ tprint('Использование: trace hidden_route [--force]','err'); break; }
    if(state.shift<4){ tprint('Маршрут неизвестен.','err'); break; }
    if(a[2]!=='--force'){ tprint('Маршрут частично скрыт.\nТребуется флаг принудительной трассировки:\n  trace hidden_route --force'); break; }
    attn(10);
    tprint('01 CORE-GATE       12 ms\n02 ROUTE-09        18 ms\n03 ARCHIVE-04      41 ms\n04 NODE-17         response_without_source');
    state.node17Visible=true; state.flags.traced=true;
    addLog(lg(nowT(),'TRACE','','FORCED','dst=NODE-17 result=exposed','bad'));
    fact('Трассировка выявила скрытый узел NODE-17 за ARCHIVE-04.');
    toast('Узел NODE-17 появился на карте сети.','warn');
    renderAll();
    break; }
  case 'ls': {
    const node=archNode(state.archivePath);
    tprint((node.children||[]).map(ch=>(ch.dir?'[DIR]  ':'[FILE] ')+ch.name+((ch.locked&&ch.locked())?'  (locked)':'')).join('\n'));
    break; }
  case 'cat': case 'cp': {
    const path=(a.slice(1).join(' ')||'').replace(/^\/+/,'').split('/').filter(Boolean);
    if(path[0]!=='archive'){ tprint('Путь должен начинаться с /archive/','err'); break; }
    let node=ARCHIVE, ok=true;
    for(let i=1;i<path.length;i++){
      const nx=(node.children||[]).find(ch=>ch.name===path[i]);
      if(!nx){ ok=false; break; }
      if(nx.locked&&nx.locked()){ tprint('Доступ запрещён: /'+path.slice(0,i+1).join('/')+'/','err'); ok=false; break; }
      node=nx;
    }
    if(!ok) break;
    if(!node.content&&node.dir){ tprint('Это каталог.','err'); break; }
    if(c==='cat'){ if(node.onRead&&!node.read){node.read=true;node.onRead();afterAct();} tprint(node.content); }
    else { if(node.ev){ addEvidence(node.ev); attn(5); afterAct(); } else tprint('Файл не является уликой.','err'); }
    break; }
  case 'unlock': {
    const code=(a[2]||'').toLowerCase();
    if(a[1]==='archive'&&code==='chayka'){ state.kiraUnlocked=true; tprint('Доступ к /kira_archive/ открыт.'); fact('Личный архив Киры открыт (код «Чайка»).'); afterAct(); }
    else if(a[1]==='lost_sessions'&&code==='node17_4471'){ state.lostUnlocked=true; state.flags.opened_lost_sessions=true; tprint('Доступ к /lost_sessions/ открыт.'); attn(5); afterAct(); }
    else tprint('Неверная команда или код.','err');
    break; }
  case 'sec': tprint('Уровень аудита: '+state.attention+'%'); break;
  case 'contact':
    if(a[1]==='k.lanskaya'){
      if(state.node17Connected){ tprint('CHANNEL OPEN...\n> Не пиши прямо. Он читает открытые строки.\n> Используй архив.'); state.flags.contacted_kira=true; attn(10); fact('Кира ответила через скрытый канал.'); afterAct(); }
      else tprint('Нет ответа.','err');
    } else tprint('Использование: contact k.lanskaya','err');
    break;
  case 'isolate': finalFromTerm('isolate'); break;
  case 'upload': finalFromTerm('upload'); break;
  case 'rescue': finalFromTerm('rescue'); break;
  case 'replace': finalFromTerm('replace'); break;
  case 'delete': if(a[1]==='all') finalFromTerm('delete'); else tprint('Использование: delete all','err'); break;
  default: tprint('Команда не найдена: '+c+'. См. help.','err');
  }
}
function finalFromTerm(key){
  if(state.shift!==6){ tprint('Команда заблокирована до финальной смены.','err'); return; }
  const guards={upload:evComplete(),rescue:!!(state.flags.rescue_ready&&evPartial()),replace:!!(state.attention>=75&&state.flags.found_operator_session),isolate:true,delete:true};
  if(!guards[key]){ tprint('Недостаточно условий для этого действия.','err'); return; }
  finalAct(key);
}
